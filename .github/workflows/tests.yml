name: Offline unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: bam-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python modules
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all JavaScript UI regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in ui/*_test.js; do
            node "$test_file"
          done
      - name: Run offline tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
