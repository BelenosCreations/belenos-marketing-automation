<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>BAM — Marketing Command Center (UI Prototype)</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#0b1722;--surface:#132433;--surface2:#1b3040;--line:#304553;--text:#f0f5f7;--muted:#b0c1ca;--gold:#e9c66c;--teal:#54d5ca;--danger:#ffb5ad}
[data-theme=light]{color-scheme:light;--bg:#f3f7f9;--surface:#ffffff;--surface2:#e6f0f2;--line:#c5d4dc;--text:#132937;--muted:#506575;--gold:#806018;--teal:#167a76;--danger:#a32d24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.5}button,select,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}.brand{font-size:26px;font-weight:900;letter-spacing:.07em;color:var(--gold);padding:0 12px 22px}.brand small{display:block;font-size:10px;letter-spacing:.09em;color:var(--muted);font-weight:500}.nav{display:grid;gap:8px}.nav button,.bottom-nav button{border:0;color:var(--muted);background:transparent;text-align:left;padding:12px;border-radius:12px}.nav button[aria-current=page],.bottom-nav button[aria-current=page]{background:var(--surface2);color:var(--gold);font-weight:700}.main{min-width:0;padding:30px 32px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.eyebrow{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}h1{font-size:clamp(24px,3vw,35px);margin:4px 0 6px}h2{font-size:19px;margin:0}p{margin:5px 0;color:var(--muted)}.select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:12px;max-width:100%;min-width:205px}.demo{font-size:12px;color:var(--gold);border:1px solid #77653d;padding:7px 10px;border-radius:99px;display:inline-block;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}.card{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:170px;text-align:left;color:var(--text);transition:background .15s,transform .15s}.card:hover{background:var(--surface2);transform:translateY(-2px)}.card .number{font-size:35px;line-height:1;font-weight:850}.card .icon{font-size:23px}.card .hint{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 12px}.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;background:#284a50;color:#a8f1e9}.pill.warn{background:#55412b;color:#ffdc95}.item{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.item:first-of-type{border-top:0}.item strong{display:block}.item small{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--surface2);color:var(--text)}.btn.primary{background:var(--teal);color:#092b30;border-color:var(--teal);font-weight:800}.btn:disabled{opacity:.45;cursor:not-allowed}.back{margin-bottom:16px}.stack{display:grid;gap:14px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.field{display:grid;gap:5px;margin:12px 0;color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:11px}.field textarea{min-height:100px;resize:vertical}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.bars{display:flex;align-items:flex-end;height:140px;gap:12px;border-bottom:1px solid var(--line);padding:0 8px}.bar{flex:1;background:linear-gradient(180deg,var(--teal),#276f7c);border-radius:7px 7px 0 0}.bar-labels{display:flex;justify-content:space-around;color:var(--muted);font-size:11px;margin:8px 0}.bottom-nav{display:none}.settings-link{font-size:15px;white-space:nowrap}.setting-options{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.setting-options button[aria-pressed=true]{border-color:var(--teal);background:var(--surface2);font-weight:700}.settings-group{margin-top:18px}.time-entry{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.time-entry input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--text)}.time-list{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.notice{color:var(--gold);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.shell{display:block}.sidebar{display:none}.main{padding:20px 16px 100px}.cards{gap:10px}.card{min-height:148px;padding:16px}.card .number{font-size:31px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom));z-index:5}.bottom-nav button{text-align:center;font-size:12px;padding:9px 3px}.select{width:100%}.top{align-items:stretch}.top>div{width:100%}.item{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand">BAM<small>BELENOS AUTOMATIC MARKETING</small></div><nav class="nav" id="sideNav" aria-label="Main navigation"></nav></aside>
<main class="main"><header class="top"><div><div class="eyebrow">Marketing command center</div><h1 id="heading">Dashboard</h1><p id="subtitle">See what needs your attention.</p></div><label><span class="sr-only">Active business</span><select class="select" id="business"></select></label></header><div class="controls"><button type="button" class="btn settings-link" id="settingsButton" aria-label="Open settings">⚙ Settings</button></div><span class="demo">Interactive UI prototype • Sample data only • Nothing publishes</span><div id="view" aria-live="polite"></div></main>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
<script>
'use strict';
const SAMPLE={
  creations:{name:'Belenos Creations',posts:[{id:'c1',channel:'Facebook',title:'Custom product spotlight',text:'A closer look at what we can create for you.',suggestion:'Add a clear photo of the finished product.',missing:['product photo','photo permission'],status:'needs_content'},{id:'c2',channel:'Instagram',title:'Resin-printed artwork',text:'Custom artwork with raised, tactile depth.',suggestion:'Photograph the raised texture in natural light.',missing:['artwork photo'],status:'needs_content'},{id:'c3',channel:'Facebook',title:'Weekend hours reminder',text:'Visit the shop during posted hours.',suggestion:'Review the hours before approval.',missing:[],status:'ready_for_review'}],scheduled:4,connections:2,engagement:[24,38,31,55,48,66,72]},
  cleaning:{name:'Busy B Cleaning Service',posts:[{id:'b1',channel:'Facebook',title:'Commercial cleaning spotlight',text:'Helping workplaces stay ready for the workday.',suggestion:'Provide an approved commercial facility photo.',missing:['approved photo'],status:'needs_content'},{id:'b2',channel:'LinkedIn',title:'Team appreciation',text:'Recognizing the people behind the work.',suggestion:'Get permission before sharing a team photo.',missing:['team photo','team permission'],status:'needs_content'}],scheduled:3,connections:1,engagement:[15,18,22,21,29,31,39]}
};
const nav=[['home','⌂','Home'],['content','▤','Content'],['calendar','▦','Calendar'],['analytics','▥','Analytics']];
const state={business:'creations',page:'home',detail:null,filter:'all',drafts:structuredClone(SAMPLE),theme:'auto',scheduling:{creations:{mode:'smart',times:[]},cleaning:{mode:'smart',times:[]}}};
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node};
function button(label,fn,cls='btn'){const node=el('button',cls,label);node.type='button';node.addEventListener('click',fn);return node}
function panel(title){const node=el('section','panel');node.append(el('h2','',title));return node}
function current(){return state.drafts[state.business]}
function posts(){return current().posts}
function activePosts(){return posts().filter(p=>!['postponed','unavailable'].includes(p.status))}
function counts(){return {content:activePosts().filter(p=>p.status==='needs_content').length,approval:activePosts().filter(p=>p.status==='ready_for_review').length}}
function navigate(page,detail=null){state.page=page;state.detail=detail;render();window.scrollTo({top:0,behavior:'instant'})}
function drawNav(){for(const id of ['sideNav','bottomNav']){const target=$(id);target.replaceChildren();for(const [page,icon,name] of nav){const item=button(icon+' '+name,()=>navigate(page),'');if(state.page===page)item.setAttribute('aria-current','page');target.append(item)}}}
function metric(label,value,icon,help,fn){const node=button('',()=>fn(),'card');node.append(el('span','icon',icon),el('span','number',value),el('strong','',label),el('span','hint',help));return node}
function renderHome(root){const summary=counts(),cards=el('div','cards');cards.append(metric('Scheduled',current().scheduled,'▦','View planned posts',()=>navigate('calendar')),metric('Needs approval',summary.approval,'✓','Review prepared drafts',()=>{state.filter='ready_for_review';navigate('content')}),metric('Content needed',summary.content,'▣','Photos and materials required',()=>{state.filter='needs_content';navigate('content')}),metric('Platforms',current().connections,'◎','Connection overview',()=>navigate('connections')));root.append(cards);const section=panel('Needs your attention');const needs=activePosts().filter(p=>p.status==='needs_content'||p.status==='ready_for_review');if(!needs.length)section.append(el('div','empty','Nothing requires attention.'));for(const post of needs.slice(0,4)){const row=el('div','item'),copy=el('div');copy.append(el('strong','',post.title),el('small','',post.channel+' • '+(post.missing.length?post.missing.join(', '):'Ready for review')));row.append(copy,button('Open',()=>navigate('content',post.id)));section.append(row)}root.append(section)}
function renderContent(root){if(state.detail){renderDraft(root,state.detail);return}const bar=el('div','controls');for(const [filter,label] of [['all','All active'],['needs_content','Content needed'],['ready_for_review','Review'],['postponed','Postponed']]){const b=button(label,()=>{state.filter=filter;render()},state.filter===filter?'btn primary':'btn');bar.append(b)}root.append(bar);const section=panel('Content studio');const matches=posts().filter(p=>state.filter==='all'?!['postponed','unavailable'].includes(p.status):p.status===state.filter);if(!matches.length)section.append(el('div','empty','No drafts in this category.'));for(const post of matches){const row=el('div','item'),copy=el('div');copy.append(el('strong','',post.title),el('small','',post.channel+' • '+post.status.replaceAll('_',' ')));row.append(copy,button('Details',()=>navigate('content',post.id)));section.append(row)}root.append(section);root.append(button('+ New held draft',()=>navigate('new')))}
function renderDraft(root,id){const post=posts().find(p=>p.id===id);if(!post){navigate('content');return}root.append(button('← Back to content',()=>navigate('content'),'btn back'));const section=panel(post.title);section.append(el('p','',post.channel+' • '+post.status.replaceAll('_',' ')));section.append(el('h3','','Draft text'),el('p','',post.text),el('h3','','Suggested content'),el('p','',post.suggestion),el('h3','','Required materials'));if(post.missing.length){for(const item of post.missing)section.append(el('p','notice','• '+item))}else section.append(el('p','','No outstanding material in this sample.'));const actions=el('div','controls');for(const [status,label] of [['postponed','Postpone'],['unavailable','Mark unavailable'],['needs_content','Reopen']]){actions.append(button(label,()=>{post.status=status;navigate('content')},'btn'))}section.append(actions,el('p','notice','Prototype actions change sample data in this page only. No upload, approval, or publishing.'));root.append(section)}
function field(label,tag,placeholder){const wrapper=el('label','field',label),control=el(tag);control.placeholder=placeholder;control.required=true;wrapper.append(control);return {wrapper,control}}
function renderNew(root){root.append(button('← Back to content',()=>navigate('content'),'btn back'));const section=panel('New held draft'),form=el('form','stack');const title=field('Draft title','input','e.g. Product spotlight'),copy=field('Draft text','textarea','What would you like to say?'),suggestion=field('Content suggestion','textarea','What photos or other material are needed?'),missing=field('Required materials (comma-separated)','input','e.g. product photo, permission');const channel=el('select');for(const name of ['Facebook','Instagram','LinkedIn','Pinterest','TikTok','YouTube']){const opt=el('option','',name);opt.value=name;channel.append(opt)}const channelLabel=el('label','field','Platform');channelLabel.append(channel);form.append(title.wrapper,channelLabel,copy.wrapper,suggestion.wrapper,missing.wrapper);form.append(button('Save held draft',()=>{},'btn primary'));form.lastChild.type='submit';form.addEventListener('submit',event=>{event.preventDefault();const items=missing.control.value.split(',').map(x=>x.trim()).filter(Boolean);if(!items.length){missing.control.setCustomValidity('Provide at least one required material');missing.control.reportValidity();return}const post={id:'local-'+Math.random().toString(36).slice(2),title:title.control.value,channel:channel.value,text:copy.control.value,suggestion:suggestion.control.value,missing:items,status:'needs_content'};posts().unshift(post);state.filter='all';navigate('content',post.id)});missing.control.addEventListener('input',()=>missing.control.setCustomValidity(''));section.append(form);root.append(section)}
function renderCalendar(root){
 const section=panel('Planned schedule');
 section.append(el('p','','Illustrative scheduling summary. Actual publishing is disabled.'));
 const line=el('div','cards');
 line.append(metric('Planned posts',current().scheduled,'▦','Sample count',()=>{}),metric('Automatic publishing','Off','◌','Disabled in prototype',()=>{}));
 section.append(line);root.append(section);
 const prefs=state.scheduling[state.business],settings=panel('Posting time preference');
 settings.append(el('p','muted','Choose Smart or Manual for this business. These are local preview settings only.'));
 const controls=el('div','setting-options');
 for(const [mode,label] of [['smart','Smart times'],['manual','Manual times']]){
   const choice=button(label,()=>{prefs.mode=mode;render()},'btn');
   choice.setAttribute('aria-pressed',String(prefs.mode===mode));controls.append(choice)
 }
 settings.append(controls);
 if(prefs.mode==='smart'){
   settings.append(el('p','muted','Smart times will eventually consider the post subject, audience and connected platform performance. No time is recommended until verified data and scheduling are available.'));
 }else{
   settings.append(el('p','muted','Set explicit local posting times. No timezone or publishing is configured in this prototype.'));
   const form=el('form','time-entry'),input=el('input');
   input.type='time';input.required=true;input.setAttribute('aria-label','Manual posting time');
   const add=button('Add time',()=>{},'btn primary');add.type='submit';form.append(input,add);
   form.addEventListener('submit',event=>{
     event.preventDefault();const value=input.value;
     if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value))return;
     if(!prefs.times.includes(value)){prefs.times.push(value);prefs.times.sort()}
     render();
   });
   settings.append(form);
   const times=el('div','time-list');
   if(!prefs.times.length)times.append(el('p','muted','No manual times selected.'));
   for(const value of prefs.times)times.append(button(value+' ×',()=>{prefs.times=prefs.times.filter(t=>t!==value);render()},'btn'));
   settings.append(times);
 }
 root.append(settings)
}
function renderAnalytics(root){const section=panel('Performance overview');section.append(el('p','','Illustrative engagement values — not connected to Facebook, Instagram, or any provider.'));const bars=el('div','bars');for(const n of current().engagement){const bar=el('div','bar');bar.style.height=Math.max(5,n)+'%';bar.title='Sample index: '+n;bars.append(bar)}section.append(bars,el('div','bar-labels','Mon          Tue          Wed          Thu          Fri          Sat          Sun'));root.append(section);const more=panel('Detailed reporting');more.append(el('p','','Future drill-down: engagement, impressions, audience windows, platform comparison, and export. No live metrics available.'));root.append(more)}
function renderConnections(root){root.append(button('← Dashboard',()=>navigate('home'),'btn back'));const section=panel('Social connections');section.append(el('p','','Connection counts shown on the dashboard are illustrative. Real provider authorization and sync are not enabled.'));section.append(el('div','empty','No live social accounts connected in this prototype.'));root.append(section)}
function renderSettings(root){const section=panel('Appearance');section.append(el('p','muted','Choose how BAM looks. Auto follows your device setting.'));const choices=el('div','setting-options');for(const [value,label] of [['light','☀ Light'],['dark','☾ Dark'],['auto','Auto (device)']]){const choice=button(label,()=>{state.theme=value;render()},'btn');choice.setAttribute('aria-pressed',String(state.theme===value));choices.append(choice)}section.append(choices);section.append(el('p','muted','Appearance changes are temporary in this prototype.'));root.append(section);const more=panel('Account and business preferences');more.append(el('p','muted','Account security, notifications, team roles, social connections and business-specific settings will live here when connected to the backend.'));root.append(more)}
function render(){document.documentElement.dataset.theme=state.theme==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):state.theme;drawNav();$('heading').textContent=({home:'Dashboard',content:'Content Studio',new:'Create Draft',calendar:'Calendar',analytics:'Analytics',connections:'Connections',settings:'Settings'})[state.page]||'Dashboard';$('subtitle').textContent=state.detail?'Review content and required materials.':'Simple overview, detailed controls when you need them.';const root=$('view');root.replaceChildren();if(state.page==='home')renderHome(root);else if(state.page==='content')renderContent(root);else if(state.page==='new')renderNew(root);else if(state.page==='calendar')renderCalendar(root);else if(state.page==='analytics')renderAnalytics(root);else if(state.page==='settings')renderSettings(root);else renderConnections(root)}
for(const [id,business] of Object.entries(SAMPLE)){const opt=el('option','',business.name);opt.value=id;$('business').append(opt)}
$('settingsButton').addEventListener('click',()=>navigate('settings'));
if(window.matchMedia){const scheme=window.matchMedia('(prefers-color-scheme: light)');if(scheme.addEventListener)scheme.addEventListener('change',()=>{if(state.theme==='auto')render()})}
$('business').addEventListener('change',event=>{state.business=event.target.value;state.filter='all';navigate('home')});render();
</script>
</body>
</html>
